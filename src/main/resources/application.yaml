spring:
  application:
    name: xquare-openapi-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:PT1H}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:P14D}

# 쉼표로 구분한 허용 origin 목록. 비워 두면 다른 origin의 요청을 모두 막는다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# 나이스 급식 동기화. api-key가 비어 있으면 동기화를 건너뛴다(앱은 뜬다).
# 기본 학교는 대덕소프트웨어마이스터고등학교(대전광역시교육청 G10, 학교 코드 7430310).
# meal-sync-cron은 서울 시간 기준이고, 기본값은 매일 04:00. "-"이면 스케줄을 끈다.
neis:
  api-key: ${NEIS_API_KEY:}
  office-code: ${NEIS_OFFICE_CODE:G10}
  school-code: ${NEIS_SCHOOL_CODE:7430310}
  meal-sync-cron: ${NEIS_MEAL_SYNC_CRON:0 0 4 * * *}
