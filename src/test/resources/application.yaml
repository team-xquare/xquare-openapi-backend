spring:
  application:
    name: xquare-openapi-backend
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

server:
  forward-headers-strategy: native

jwt:
  secret: test-secret-key-must-be-at-least-32-bytes-long
  access-expiration: PT1H
  refresh-expiration: P14D

cors:
  allowed-origins: http://localhost:3000

resend:
  api-key: test-api-key
  from: XQUARE <noreply@dsm.hs.kr>
  base-url: https://api.resend.com
  connect-timeout: 5s
  read-timeout: 10s

# 이메일 상한과 IP 상한을 다른 값으로 둬서 어느 쪽에 걸렸는지 테스트에서 구분한다.
otp:
  resend-cooldown: 60s
  send-window: 1h
  max-sends-per-email: 3
  max-sends-per-ip: 4
  attempt-window: 1h
  max-attempts: 5
