spring:
  application:
    name: xquare-openapi-backend
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

jwt:
  secret: test-secret-key-must-be-at-least-32-bytes-long
  access-expiration: PT1H
  refresh-expiration: P14D

cors:
  allowed-origins: http://localhost:3000

# 테스트에서는 나이스를 부르지 않는다. 동기화 테스트는 MockRestServiceServer로 클라이언트를 직접 만든다.
neis:
  api-key: ""
  office-code: G10
  school-code: 7430310
  meal-sync-cron: "-"
