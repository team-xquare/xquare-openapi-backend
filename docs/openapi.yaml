  /meals:
    get:
      tags:
      - 급식
      summary: 월간 급식 조회
      description: 'startDate~finishDate 기간의 급식 목록(조식/중식/석식 메뉴 배열)을 날짜 순으로 반환한다. 급식이 없는 날짜(방학·주말 등)와 관리자가 ''급식 없음''으로 표시한 날짜는 meals와 totalCount에 포함하지 않는다.
        둘 다 생략하면 이번 달(서울 시간 기준) 1일~말일, startDate만 주면 그 달 말일까지, finishDate만 주면 그 달 1일부터 조회한다. 기간은 시작일·종료일을 포함해 최대 92일이다.
        권한: 공개(ALL). 토큰이 없거나 유효하지 않아도 401 없이 조회된다.'
      operationId: getMonthlyMeals
      security: []
      parameters:
      - name: startDate
        in: query
        required: false
        description: 조회 시작 날짜(yyyy-MM-dd). 생략하면 finishDate가 속한 달(없으면 이번 달)의 1일
        schema:
          type: string
          format: date
          example: '2026-09-01'
      - name: finishDate
        in: query
        required: false
        description: 조회 종료 날짜(yyyy-MM-dd). 생략하면 startDate가 속한 달(없으면 이번 달)의 말일
        schema:
          type: string
          format: date
          example: '2026-09-03'
      responses:
        '200':
          description: 기간 내 급식 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealListResponse'
        '400':
          description: 'INVALID_DATE_RANGE: finishDate가 startDate보다 이르거나 기간이 92일을 넘음 / `INVALID_INPUT`: 날짜 형식 오류'
          content:
            application/json:
              schema: &id007
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_DATE_RANGE:
                  value:
                    code: INVALID_DATE_RANGE
                    message: 조회 기간이 올바르지 않습니다.
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 'startDate: 형식이 올바르지 않습니다.'
    post:
      tags:
      - 급식
      summary: 급식 등록
      description: '날짜별 급식(조식/중식/석식 메뉴 배열)을 등록한다. 해당 날짜의 급식 정보가 이미 있으면 409. 메뉴는 나이스 급식 정보 기준.
        모든 필드가 필수이고, 급식이 없는 끼니는 빈 배열로 보낸다. 관리자가 등록한 급식은 나이스 동기화가 덮어쓰지 않는다.
        세 끼를 모두 빈 배열로 보내면 그 날짜를 ''급식 없음''으로 표시해 나이스 동기화가 급식을 만들지 못하게 막는다(조회에서 빠지고 Location의 id는 단건 조회 404).
        ''급식 없음''으로 표시된 날짜는 비어 있는 날짜로 보고 409 없이 그 표시를 새 급식으로 바꾼다(201, Location은 그 표시의 id). 권한: ADMIN.'
      operationId: createMeal
      security:
      - bearerAuth: []
      x-required-role: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealCreateRequest'
            example:
              date: '2026-09-01'
              breakfast:
              - 볶음밥
              - 미역국
              - 계란말이
              lunch:
              - 백미밥
              - 된장찌개
              - 잡채
              dinner:
              - 카레라이스
              - 김치전
      responses:
        '201':
          description: 생성됨
          headers:
            Location:
              description: 생성된 리소스를 상세조회하는 URI
              schema:
                type: string
                format: uri-reference
                example: /meals/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: 생성되었습니다.
        '400':
          description: '`INVALID_INPUT`: 필수 값 누락, 날짜 형식 오류, 끼니당 메뉴 20개 초과, 메뉴가 공백·50자 초과·제어 문자 포함'
          content:
            application/json:
              schema: *id007
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
        '409':
          description: 'MEAL_ALREADY_EXISTS: 해당 날짜의 급식 정보가 이미 존재함'
          content:
            application/json:
              schema: *id007
              examples:
                MEAL_ALREADY_EXISTS:
                  value:
                    code: MEAL_ALREADY_EXISTS
                    message: 해당 날짜의 급식 정보가 이미 존재함
        '401':
          description: 'INVALID_TOKEN: 토큰이 없거나 유효하지 않음'
          content:
            application/json:
              schema: *id007
              examples:
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 토큰이 없거나 유효하지 않음
        '403':
          description: 'FORBIDDEN: 권한 없음'
          content:
            application/json:
              schema: *id007
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: 권한 없음
