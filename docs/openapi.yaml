      description: '공지를 삭제한다(하드 삭제). 작성자가 아니어도 ADMIN이면 삭제할 수 있다. 권한: ADMIN.'
      operationId: deleteNotice
      security:
      - bearerAuth: []
      x-required-role: ADMIN
      parameters:
      - name: noticeId
        in: path
        required: true
        description: 삭제할 공지의 id
        schema:
          type: integer
          format: int64
          example: 1
      responses:
        '200':
          description: 삭제됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: 삭제되었습니다.
        '400':
          description: '`INVALID_INPUT`: 숫자가 아닌 noticeId'
          content:
            application/json:
              schema: *id007
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: '요청 값이 올바르지 않습니다.'
        '401':
          description: 'INVALID_TOKEN: 토큰이 없거나 유효하지 않음'
          content:
            application/json:
              schema: *id007
              examples:
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 토큰이 없거나 유효하지 않음
        '403':
          description: 'FORBIDDEN: 권한 없음'
          content:
            application/json:
              schema: *id007
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: 권한 없음
        '404':
          description: 'NOTICE_NOT_FOUND: 이미 삭제되었거나 존재하지 않는 공지 id'
          content:
            application/json:
              schema: *id007
              examples:
                NOTICE_NOT_FOUND:
                  value:
                    code: NOTICE_NOT_FOUND
                    message: 이미 삭제되었거나 존재하지 않는 공지 id
  /admin/api-usage-logs:
    get:
      summary: 관리자 API 사용 기록 조회
      description: '기본 기간은 최근 24시간. 마이크로초로 저장된 완료 시각에 from 이상, to 미만을 적용한다(최대 31일). 완료 시각, ID 순으로 내림차순 정렬한다.'
      operationId: listApiUsageLogs
      security:
      - bearerAuth: []
      x-required-role: ADMIN
      parameters:
      - name: from
        in: query
        description: '시작 시각(포함). to와 함께 지정한다.'
        schema: {type: string, format: date-time}
      - name: to
        in: query
        description: '종료 시각(제외). from과 함께 지정한다.'
        schema: {type: string, format: date-time}
      - name: method
        in: query
        schema:
          type: string
          enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS, TRACE, CONNECT, OTHER]
      - name: status
        in: query
        schema: {type: integer, format: int32, minimum: 100, maximum: 599}
      - name: page
        in: query
        schema: {type: integer, format: int32, minimum: 0, maximum: 1000, default: 0}
      - name: size
        in: query
        schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUsageLogPageResponse'
        '400':
          description: INVALID_INPUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: INVALID_TOKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: CONCURRENT_UPDATE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: '`POST /api-keys`로 발급받은 API 키. 활용신청한 분야의 조회 API만 열 수 있다'
  schemas:
    ApiKeyField:
      type: string
      description: '활용신청 분야. STUDENT(학생), TEACHER(교직원), CLUB(동아리), SCHEDULE(일정), STUDY_SUPERVISOR(자습 감독). 급식은 키 없이 호출하므로 분야가 없다'
      enum:
      - STUDENT
      - TEACHER
      - CLUB
      - SCHEDULE
      - STUDY_SUPERVISOR
      example: STUDENT
    ApiKeyApplicationType:
      type: string
      description: '신청 구분. FIRST(첫 신청, 키 발급), ADD_FIELD(분야 추가, 기존 키 유지)'
      enum:
      - FIRST
      - ADD_FIELD
      example: FIRST
    ApiKeyApplicationRequest:
      type: object
      required:
      - field
      - serviceName
      - purpose
      - emailVerifiedToken
      properties:
        field:
          $ref: '#/components/schemas/ApiKeyField'
        serviceName:
          type: string
          minLength: 1
          maxLength: 30
          description: API를 사용할 서비스 이름
          example: 급식 알리미
        purpose:
          type: string
          minLength: 1
          maxLength: 200
          description: 사용 목적
          example: 반 단톡방에 매일 급식을 올리려고 합니다.
        emailVerifiedToken:
          type: string
          minLength: 1
          description: '`POST /auth/email/otp/verify`가 준 토큰. 로그인한 계정의 이메일로 받은 것이어야 한다'
          example: 3f1c2a9e-8b7d-4e6f-9a01-2b3c4d5e6f70
    ApiKeyApplicationResponse:
      type: object
      required:
      - type
      - apiKey
      properties:
        type:
          $ref: '#/components/schemas/ApiKeyApplicationType'
        apiKey:
          type:
          - string
          - 'null'
          description: 첫 신청(FIRST)이면 발급한 키 원문(`xq_` 뒤에 43자, 이 응답에서만 볼 수 있음). 분야 추가(ADD_FIELD)면 null
          example: xq_UNhY4JhezH9gQYqvDMWrWH9CwlcKiECVqejMrND2VFw
    AppliedField:
      type: object
      required:
      - field
      - appliedAt
      properties:
        field:
          $ref: '#/components/schemas/ApiKeyField'
        appliedAt:
          type: string
          format: date-time
          description: 그 분야를 신청한 시각. 한국 시간(Asia/Seoul) +09:00 오프셋을 붙인 RFC 3339 형식
          example: '2026-11-18T09:30:00+09:00'
    MyApiKeyResponse:
      type: object
      required:
      - issuedAt
      - expiresAt
      - fields
      properties:
        issuedAt:
          type: string
          format: date-time
          description: 지금 키 값을 발급한 시각(첫 신청 또는 마지막 재발급). 한국 시간(Asia/Seoul) +09:00 오프셋을 붙인 RFC 3339 형식
          example: '2026-11-18T09:30:00+09:00'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 만료 시각. 만료 정책이 없어 항상 null(만료 없음)
          example: null
        fields:
          type: array
          description: 신청한 분야. 신청 순서대로
          items:
            $ref: '#/components/schemas/AppliedField'
    ApiKeyApplicationSummary:
      type: object
      required: [id, userId, field, type, serviceName, purpose, appliedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int64
          description: 신청자(키 주인) id
          example: 2
        field:
          $ref: '#/components/schemas/ApiKeyField'
        type:
          $ref: '#/components/schemas/ApiKeyApplicationType'
        serviceName:
          type: string
          example: 급식 알리미
        purpose:
          type: string
          example: 반 단톡방에 매일 급식을 올리려고 합니다.
        appliedAt:
          type: string
          format: date-time
          description: 신청 시각. 한국 시간(Asia/Seoul) +09:00 오프셋을 붙인 RFC 3339 형식
          example: '2026-11-18T09:30:00+09:00'
    ApiKeyApplicationPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyApplicationSummary'
        page:
          type: integer
          format: int32
          example: 0
        size:
          type: integer
          format: int32
          example: 20
        totalCount:
          type: integer
          format: int64
          example: 3
        totalPage:
          type: integer
          format: int32
          example: 1
    ApiKeyApplicant:
      type: object
      required: [username, name, email, studentNumber]
      properties:
        username:
          type: string
          example: junseo
        name:
          type: string
          example: 김준서
        email:
          type: string
          example: junseo@dsm.hs.kr
        studentNumber:
          type: integer
          format: int32
          example: 2315
    ApiKeyApplicationDetailResponse:
      type: object
      required: [id, field, type, serviceName, purpose, appliedAt, userId, applicant, fields]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        field:
          $ref: '#/components/schemas/ApiKeyField'
        type:
          $ref: '#/components/schemas/ApiKeyApplicationType'
        serviceName:
          type: string
          example: 급식 알리미
        purpose:
          type: string
          example: 반 단톡방에 매일 급식을 올리려고 합니다.
        appliedAt:
          type: string
          format: date-time
          description: 신청 시각. 한국 시간(Asia/Seoul) +09:00 오프셋을 붙인 RFC 3339 형식
          example: '2026-11-18T09:30:00+09:00'
        userId:
          type: integer
          format: int64
          description: 신청자(키 주인) id
          example: 2
        applicant:
          description: 신청자 정보. 사용자 행이 지워졌으면 null
          oneOf:
          - $ref: '#/components/schemas/ApiKeyApplicant'
          - type: 'null'
        fields:
          type: array
          description: 이 신청이 속한 키가 신청한 분야 전체. 신청 순서대로
          items:
            $ref: '#/components/schemas/AppliedField'
    ApiKeyReissueRequest:
      type: object
      required:
      - emailVerifiedToken
      properties:
        emailVerifiedToken:
          type: string
          minLength: 1
          description: '`POST /auth/email/otp/verify`가 준 토큰. 로그인한 계정의 이메일로 받은 것이어야 한다'
          example: 3f1c2a9e-8b7d-4e6f-9a01-2b3c4d5e6f70
    ApiKeyResponse:
      type: object
      required:
      - apiKey
      properties:
        apiKey:
          type: string
          description: 발급한 API 키 원문. `xq_` 뒤에 43자. 이 응답에서만 볼 수 있다.
          example: xq_UNhY4JhezH9gQYqvDMWrWH9CwlcKiECVqejMrND2VFw
    ApiUsageLogPageResponse:
      type: object
      required: [content, page, size, totalCount, totalPage]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ApiUsageLogResponse'
        page: {type: integer, format: int32}
        size: {type: integer, format: int32}
        totalCount: {type: integer, format: int64}
        totalPage: {type: integer, format: int32}
    ApiUsageLogResponse:
      type: object
      required: [id, occurredAt, method, route, status, durationMs]
      properties:
        id: {type: integer, format: int64}
        occurredAt: {type: string, format: date-time, description: UTC 요청 완료 시각}
        method:
          type: string
          enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS, TRACE, CONNECT, OTHER]
        route: {type: string, maxLength: 160, description: 'MVC 경로 템플릿 또는 UNMAPPED'}
        status: {type: integer, format: int32}
        durationMs: {type: integer, format: int64, minimum: 0}
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 에러 코드
          example: INVALID_INPUT
        message:
          type: string
          description: 사람이 읽을 수 있는 에러 메시지
          example: 요청 값이 올바르지 않습니다.
    AuthEmailOtpSendRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          description: 인증코드를 받을 이메일. `@dsm.hs.kr` 형식만 허용. 앞뒤 공백을 지우고 소문자로 바꾼 값을 쓰므로 대소문자가 달라도 같은 이메일로 보고 발송 제한도 함께 센다. 로컬 파트는 영문·숫자·`.`·`_`·`-`만 허용하며 점은 앞뒤나 연달아 올 수 없음(`+`, 따옴표, 역슬래시, 괄호 등은 INVALID_EMAIL_FORMAT)
          example: example@dsm.hs.kr
    AuthEmailOtpVerifyRequest:
      type: object
      required:
      - email
      - otp
      properties:
        email:
          type: string
          description: 인증코드를 발송받은 이메일. `@dsm.hs.kr` 형식만 허용. 발송 API와 같이 앞뒤 공백을 지우고 소문자로 바꿔 비교하며, 발급하는 토큰에도 소문자 이메일을 연결함. 로컬 파트 규칙은 발송 API와 같음
          example: example@dsm.hs.kr
        otp:
          type: string
          description: 이메일로 발송된 6자리 인증코드
          example: '483920'
    AuthEmailVerifiedTokenResponse:
      type: object
      properties:
        emailVerifiedToken:
          type: string
          description: 이메일 인증 완료 토큰. 600초 동안 유효하며 회원가입 요청에 포함해 전달
          example: 3f2a9c1e-7b4d-4e8a-9c2f-1d5e6a7b8c9d
    AuthLoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: 로그인 아이디. 4~15자 영문/숫자/하이픈/언더스코어
          example: Jun227
        password:
          type: string
          description: 비밀번호. 8~20자, 특수문자 포함
          example: Password1!
    AuthReissueRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          description: 로그인 시 발급받은 리프레시 토큰
          example: eyJhbGci...
    AuthPasswordResetRequest:
      type: object
      required:
      - emailVerifiedToken
      - newPassword
      properties:
        emailVerifiedToken:
          type: string
          description: 이메일 OTP 검증으로 받은 인증 완료 토큰(600초 유효, 1회용). 회원가입과 같은 토큰
          example: 3f2a9c1e-7b4d-4e8a-9c2f-1d5e6a7b8c9d
        newPassword:
          type: string
          minLength: 8
          maxLength: 20
          pattern: ^(?=.*[^A-Za-z0-9])[\x21-\x7E]{8,20}$
          description: 새 비밀번호. 회원가입 password와 같은 규칙(8~20자, 특수문자 1개 이상, 공백을 뺀 ASCII)
          example: NewPassword1!
    AuthSignupRequest:
      type: object
      required:
      - username
      - password
      - studentNumber
      - name
      - email
      - emailVerifiedToken
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9_-]{4,15}$
          description: 로그인 아이디. 4~15자 영문/숫자/하이픈/언더스코어
          example: Jun227
        password:
          type: string
          minLength: 8
          maxLength: 20
          pattern: ^(?=.*[^A-Za-z0-9])[\x21-\x7E]{8,20}$
          description: 비밀번호. 8~20자, 특수문자 1개 이상 포함. 공백을 뺀 ASCII 문자만 허용(BCrypt 72바이트 제한). 서버에서 BCrypt로 인코딩해 저장
          example: Password1!
        studentNumber:
          type: integer
          format: int32
          minimum: 1000
          maximum: 3999
          description: 학번. 1000~3999 범위의 4자리
          example: 2315
        name:
          type: string
          minLength: 1
          maxLength: 10
          description: 이름. 1~10자, 공백만으로는 불가
          example: 장윤호
        email:
          type: string
          format: email
          description: 인증을 완료한 이메일. OTP API와 같은 규칙으로 앞뒤 공백을 지우고 소문자로 바꾼 뒤 검사함. `@dsm.hs.kr` 형식만 허용하며 로컬 파트는 영문·숫자·`.`·`_`·`-`만 허용(어기면 400 INVALID_INPUT). 정규화한 값으로 토큰의 이메일과 비교하고 저장함. 이미 가입된 이메일이면 409 EMAIL_ALREADY_EXISTS
          example: example@dsm.hs.kr
        emailVerifiedToken:
          type: string
          description: 이메일 OTP 검증 API에서 받은 토큰. 토큰에 연결된 이메일과 email이 같아야 함
          example: 3f2a9c1e-7b4d-4e8a-9c2f-1d5e6a7b8c9d
    AuthTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: '액세스 토큰. `Authorization: Bearer {accessToken}` 헤더로 전달'
          example: eyJhbGci...
        refreshToken:
          type: string
          description: 리프레시 토큰. 액세스 토큰 재발급에 사용
          example: eyJhbGci...
    UserMyInfoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 사용자 id (액세스 토큰의 sub)
          example: 1
        username:
          type: string
          description: 로그인 아이디
          example: Jun227
        name:
          type: string
          description: 이름
          example: 장윤호
        studentNumber:
          type: integer
          format: int32
          description: 가입 시 입력한 학번
          example: 2315
        email:
          type: string
          description: 가입한 이메일
          example: example@dsm.hs.kr
        role:
          type: string
          enum:
          - USER
          - ADMIN
          description: 권한
          example: USER
    StudentClub:
      type: &id010
      - object
      - 'null'
      description: 소속 동아리 정보. 동아리가 없으면 null
      properties: &id011
        id:
          type: integer
          description: 동아리 id
          format: int64
          example: 1
        name:
          type: string
          description: 동아리 이름
          example: DMS
        logo:
          type: string
          description: 동아리 로고
          example: sakjdfk-jfksdajkfjasdkimage.png
    StudentCreateRequest:
      type: object
      properties:
        studentNumber:
          type: integer
          description: 학번. 1000~3999 범위의 4자리로 앞 1자리가 학년, 다음 1자리가 반, 마지막 2자리가 번호.
          format: int32
          minimum: 1000
          maximum: 3999
          example: 2315
        name:
          type: string
          description: 이름
          example: 김준서
        birthDate:
          type: string
          description: 생일
          format: date
          example: '2009-07-28'
        email:
          type: string
          description: 이메일. `@dsm.hs.kr` 형식만 허용.
          example: junseo@dsm.hs.kr
      required:
      - studentNumber
      - name
      - birthDate
      - email
    StudentUpdateRequest:
      type: object
      required:
      - studentNumber
      - name
      - birthDate
      - email
      properties:
        studentNumber:
          type: integer
          description: 학번. 1000~3999 범위의 4자리로 앞 1자리가 학년, 다음 1자리가 반, 마지막 2자리가 번호.
          format: int32
          minimum: 1000
          maximum: 3999
          example: 2315
        name:
          type: string
          description: 이름
          example: 김준서
        birthDate:
          type: string
          description: 생일
          format: date
