openapi: 3.1.0
info:
  title: XQUARE Open API
  version: 0.1.0
  description: |-
    노션 "xquare open API"의 API 명세서와 기능 명세서를 합쳐 만든 명세입니다. 두 명세서가 다르면 API 명세서를 따랐습니다.

    권한: `security: []`인 API는 인증 없이 호출할 수 있고, 나머지는 `Authorization: Bearer <accessToken>`이 필요합니다. 필요한 권한은 `x-required-role`(USER, ADMIN)에 적었습니다.
tags:
- name: 인증/인가
- name: 학생
- name: 교직원
- name: 자습 감독
- name: 일정
- name: 급식
- name: 동아리
- name: 공지
paths:
  /auth/email/otp:
    post:
      tags:
      - 인증/인가
      summary: 이메일 OTP 발송
      description: 'DSM 이메일(@dsm.hs.kr)로 회원가입용 6자리 인증코드(100000~999999)를 발송한다. 코드는 Redis에 이메일을 key로 300초 TTL로 저장되며 `email/otp`
        템플릿으로 발송된다. 권한: ALL(비로그인 허용).'
      operationId: sendEmailOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailOtpSendRequest'
      responses:
        '200':
          description: 인증코드 발송 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: 'INVALID_EMAIL_FORMAT: @dsm.hs.kr 형식이 아님'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_EMAIL_FORMAT:
                  value:
                    code: INVALID_EMAIL_FORMAT
                    message: '@dsm.hs.kr 형식이 아닙니다.'
        '500':
          description: 'EMAIL_SEND_FAILED: 메일 발송 또는 인증코드 저장 실패'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_SEND_FAILED:
                  value:
                    code: EMAIL_SEND_FAILED
                    message: 메일 발송 또는 인증코드 저장에 실패했습니다.
  /auth/email/otp/verify:
    post:
      tags:
      - 인증/인가
      summary: 이메일 OTP 검증
      description: '이메일로 받은 6자리 인증코드를 검증하고 회원가입용 emailVerifiedToken을 발급한다. 검증 성공 시 기존 OTP는 삭제되며, 토큰은 600초 TTL로 저장되어 회원가입 요청에
        사용된다. 권한: ALL(비로그인 허용).'
      operationId: verifyEmailOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailOtpVerifyRequest'
      responses:
        '200':
          description: 인증 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEmailVerifiedTokenResponse'
        '400':
          description: |-
            OTP_NOT_FOUND: 발송된 인증코드가 없거나 만료됨 (재발송 필요)
            OTP_MISMATCH: 인증코드 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                OTP_NOT_FOUND:
                  value:
                    code: OTP_NOT_FOUND
                    message: 발송된 인증코드가 없거나 만료되었습니다. 재발송이 필요합니다.
                OTP_MISMATCH:
                  value:
                    code: OTP_MISMATCH
                    message: 인증코드가 일치하지 않습니다.
  /auth/login:
    post:
      tags:
      - 인증/인가
      summary: 로그인
      description: 'username으로 사용자를 조회하고 BCrypt로 비밀번호를 검증한 뒤 accessToken과 refreshToken을 발급한다. 아이디 존재 여부 노출을 막기 위해 아이디/비밀번호
        오류는 구분하지 않고 INVALID_CREDENTIALS 하나로 응답한다(기능 명세서). 아이디가 없을 때도 비밀번호 비교를 거쳐 응답 시간으로도 아이디 존재 여부가 드러나지 않게 한다.
        username·password가 비어 있으면 400 INVALID_INPUT이고, 형식(길이·문자 종류)은 검사하지 않아 형식이 틀린 값은 INVALID_CREDENTIALS가 된다(현재 구현 기준).
        다시 로그인하면 이전에 발급한 refreshToken은 폐기된다(사용자당 세션 하나). 로그인 5회 실패 시 계정이 잠긴다(ACCOUNT_LOCKED, 잠금 해제 조건은 미정이라 아직 구현하지
        않음). 권한: ALL(비로그인 허용).'
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 'INVALID_INPUT: username 또는 password가 비어 있음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
        '401':
          description: 'INVALID_CREDENTIALS: 아이디 또는 비밀번호 불일치'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_CREDENTIALS:
                  value:
                    code: INVALID_CREDENTIALS
                    message: 아이디 또는 비밀번호가 올바르지 않습니다.
        '423':
          description: 'ACCOUNT_LOCKED: 로그인 5회 실패로 계정 잠금'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ACCOUNT_LOCKED:
                  value:
                    code: ACCOUNT_LOCKED
                    message: 로그인 5회 실패로 계정이 잠겼습니다.
  /auth/reissue:
    post:
      tags:
      - 인증/인가
      summary: 토큰 재발급
      description: '로그인 시 발급받은 refreshToken으로 새 accessToken과 refreshToken을 발급한다. 사용된 refreshToken은 폐기된다. 사용자당 가장 최근에 발급한 refreshToken
        하나만 유효해서, 이미 재발급에 썼거나 그 뒤 다시 로그인한 refreshToken은 INVALID_REFRESH_TOKEN이다. refreshToken이 비어 있으면 400 INVALID_INPUT(현재 구현 기준).
        권한: ALL(비로그인 허용).'
      operationId: reissueToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthReissueRequest'
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 'INVALID_INPUT: refreshToken이 비어 있음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
        '401':
          description: 'INVALID_REFRESH_TOKEN: 리프레시 토큰이 없거나 만료·폐기됨 (재로그인 필요)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_REFRESH_TOKEN:
                  value:
                    code: INVALID_REFRESH_TOKEN
                    message: 리프레시 토큰이 없거나 만료 또는 폐기되었습니다. 재로그인이 필요합니다.
  /auth/signup:
    post:
      tags:
      - 인증/인가
      summary: 회원가입
      description: '이메일 OTP 검증으로 받은 emailVerifiedToken을 사용해 계정을 생성한다. 토큰에 연결된 이메일과 요청 email이 같아야 한다. 비밀번호는 BCrypt로 인코딩해 저장하며,
        기본 권한은 USER이다. 가입 즉시 로그인 처리되어 토큰을 반환한다. 입력 검증 실패 시 400 INVALID_INPUT을 반환한다(현재 구현 기준). 권한: ALL(비로그인 허용).'
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSignupRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 'INVALID_INPUT: 요청 값 검증 실패'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
        '403':
          description: 'EMAIL_NOT_VERIFIED: emailVerifiedToken이 없거나 만료됨, 또는 토큰의 이메일과 요청 이메일 불일치'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_NOT_VERIFIED:
                  value:
                    code: EMAIL_NOT_VERIFIED
                    message: 이메일 인증이 완료되지 않았습니다.
        '409':
          description: 'USERNAME_ALREADY_EXISTS: 이미 사용 중인 아이디 / EMAIL_ALREADY_EXISTS: 이미 가입된 이메일'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USERNAME_ALREADY_EXISTS:
                  value:
                    code: USERNAME_ALREADY_EXISTS
                    message: 이미 사용 중인 아이디입니다.
                EMAIL_ALREADY_EXISTS:
                  value:
                    code: EMAIL_ALREADY_EXISTS
                    message: 이미 사용 중인 이메일입니다.
  /students:
    get:
      tags:
      - 학생
      summary: 학생 전체 조회
      description: '이름(부분 일치), 학년, 반 조건으로 학생 목록을 페이지 단위로 조회한다. 응답은 `content` 리스트와 페이지 정보를 반환한다. 권한: USER.'
      operationId: getStudents
      security:
      - bearerAuth: []
      x-required-role: USER
      parameters:
      - name: name
        in: query
        required: false
        description: 검색할 학생의 이름. 부분 일치 검색. `%`, `_`도 와일드카드가 아닌 글자 그대로 찾는다.
        schema:
          type: string
          example: 민
      - name: grade
        in: query
        required: false
        description: 검색할 학년. 1~3.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
          example: 2
      - name: classNum
        in: query
        required: false
        description: 검색할 반. 0~9 (학번 1000~3999에서 나올 수 있는 반).
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 9
          example: 3
      - &id002
        name: page
        in: query
        required: false
        description: 페이지 번호. 0부터 시작하며 생략하면 0. 최대 21474836(page × size가 int 범위를 넘지 않도록).
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
          maximum: 21474836
          example: 0
      - &id003
        name: size
        in: query
        required: false
        description: 한 페이지에 담을 개수. 생략하면 20, 최대 100.
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          example: 20
      responses:
        '200':
          description: 학생 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPageResponse'
        '400':
          description: '`INVALID_INPUT`: page가 0보다 작거나 size가 1~100을 벗어남, grade가 1~3·classNum이 0~9를 벗어남, 또는 숫자 조건에 숫자가 아닌 값'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
        '401':
          description: '`INVALID_TOKEN`: 토큰이 없거나 유효하지 않음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 토큰이 없거나 유효하지 않음
    post:
      tags:
      - 학생
      summary: 학생 정보 등록
      description: '학생 정보를 등록한다. 성공 시 `Location` 헤더에 상세조회 URI를 반환한다. 학번은 1000~3999 범위의 4자리(앞 1자리 학년, 다음 1자리 반, 마지막 2자리 번호)이며
        중복될 수 없다. 이메일은 `@dsm.hs.kr` 형식만 허용된다. 소속 동아리는 이 API에서 다루지 않으며 동아리 등록·수정의 `member`로만 변경된다. 권한: ADMIN.'
      operationId: createStudent
      security:
      - bearerAuth: []
      x-required-role: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreateRequest'
            example: &id001
              studentNumber: 2315
              name: 김준서
              birthDate: '2009-07-28'
              email: junseo@dsm.hs.kr
      responses:
        '201':
          description: 생성됨
          headers:
            Location:
              description: 등록된 학생을 상세조회하는 URI
              schema:
                type: string
                format: uri-reference
                example: /students/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: 생성되었습니다.
        '400':
          description: '`INVALID_STUDENT_NUMBER`: 1000~3999 범위를 벗어난 학번 / `INVALID_INPUT`: 필수 값 누락, 이름 공백·10자 초과, `@dsm.hs.kr`이 아닌 이메일, 날짜 형식 오류'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_STUDENT_NUMBER:
                  value:
                    code: INVALID_STUDENT_NUMBER
                    message: 1000~3999 범위를 벗어난 학번
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
        '401':
          description: '`INVALID_TOKEN`: 토큰이 없거나 유효하지 않음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 토큰이 없거나 유효하지 않음
        '403':
          description: '`FORBIDDEN`: 권한 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: 권한 없음
        '409':
          description: '`STUDENT_NUMBER_ALREADY_EXISTS`: 이미 사용 중인 학번'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                STUDENT_NUMBER_ALREADY_EXISTS:
                  value:
                    code: STUDENT_NUMBER_ALREADY_EXISTS
                    message: 이미 사용 중인 학번
  /students/{studentId}:
    get:
      tags:
      - 학생
      summary: 학생 조회
      description: '학생 id로 학생 한 명의 정보를 조회한다. 권한: USER.'
      operationId: getStudent
      security:
      - bearerAuth: []
      x-required-role: USER
      parameters:
      - name: studentId
        in: path
        required: true
        description: 조회할 학생의 id
        schema:
          type: integer
          format: int64
          example: 1
      responses:
        '200':
          description: 학생 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '401':
          description: '`INVALID_TOKEN`: 토큰이 없거나 유효하지 않음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 토큰이 없거나 유효하지 않음
        '404':
          description: '`STUDENT_NOT_FOUND`: 존재하지 않는 학생 id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                STUDENT_NOT_FOUND:
                  value:
                    code: STUDENT_NOT_FOUND
                    message: 존재하지 않는 학생 id
    patch:
      tags:
      - 학생
      summary: 학생 정보 수정
      description: '학생 정보를 수정한다. 등록과 같은 모든 필드를 보내야 하며, 보낸 값으로 통째로 바꾼다. 학번은 1000~3999 범위의 4자리(앞 1자리 학년, 다음 1자리 반, 마지막 2자리 번호)이며 중복될 수 없다. 이메일은 `@dsm.hs.kr` 형식만 허용된다.
        소속 동아리는 이 API에서 다루지 않으며 동아리 등록·수정의 `member`로만 변경된다. 권한: ADMIN.'
      operationId: updateStudent
      security:
      - bearerAuth: []
      x-required-role: ADMIN
      parameters:
      - name: studentId
        in: path
        required: true
        description: 수정할 학생의 id
        schema:
          type: integer
          format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateRequest'
            example: *id001
      responses:
        '200':
          description: 수정되었습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: 수정되었습니다.
        '400':
          description: '`INVALID_STUDENT_NUMBER`: 1000~3999 범위를 벗어난 학번 / `INVALID_INPUT`: 필수 값 누락, 이름 공백·10자 초과, `@dsm.hs.kr`이 아닌 이메일, 날짜 형식 오류'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_STUDENT_NUMBER:
                  value:
                    code: INVALID_STUDENT_NUMBER
                    message: 1000~3999 범위를 벗어난 학번
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
        '401':
          description: '`INVALID_TOKEN`: 토큰이 없거나 유효하지 않음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 토큰이 없거나 유효하지 않음
        '403':
