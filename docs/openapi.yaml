components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 에러 코드
          example: INVALID_INPUT
        message:
          type: string
          description: 사람이 읽을 수 있는 에러 메시지
          example: 요청 값이 올바르지 않습니다.
    AuthEmailOtpSendRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          description: 인증코드를 받을 이메일. `@dsm.hs.kr` 형식만 허용
          example: example@dsm.hs.kr
    AuthEmailOtpVerifyRequest:
      type: object
      required:
      - email
      - otp
      properties:
        email:
          type: string
          description: 인증코드를 발송받은 이메일. `@dsm.hs.kr` 형식만 허용
          example: example@dsm.hs.kr
        otp:
          type: string
          description: 이메일로 발송된 6자리 인증코드
          example: '483920'
    AuthEmailVerifiedTokenResponse:
      type: object
      properties:
        emailVerifiedToken:
          type: string
          description: 이메일 인증 완료 토큰. 600초 동안 유효하며 회원가입 요청에 포함해 전달
          example: 3f2a9c1e-7b4d-4e8a-9c2f-1d5e6a7b8c9d
    AuthLoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: 로그인 아이디. 4~15자 영문/숫자/하이픈/언더스코어
          example: Jun227
        password:
          type: string
          description: 비밀번호. 8~20자, 특수문자 포함
          example: Password1!
    AuthReissueRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          description: 로그인 시 발급받은 리프레시 토큰
          example: eyJhbGci...
    AuthSignupRequest:
      type: object
      required:
      - username
      - password
      - studentNumber
      - name
      - email
      - emailVerifiedToken
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9_-]{4,15}$
          description: 로그인 아이디. 4~15자 영문/숫자/하이픈/언더스코어
          example: Jun227
        password:
          type: string
          minLength: 8
          maxLength: 20
          pattern: ^(?=.*[^A-Za-z0-9])[\x21-\x7E]{8,20}$
          description: 비밀번호. 8~20자, 특수문자 1개 이상 포함. 공백을 뺀 ASCII 문자만 허용(BCrypt 72바이트 제한). 서버에서 BCrypt로 인코딩해 저장
          example: Password1!
        studentNumber:
          type: integer
          format: int32
          minimum: 1000
          maximum: 3999
          description: 학번. 1000~3999 범위의 4자리
          example: 2315
        name:
          type: string
          minLength: 1
          maxLength: 10
          description: 이름. 1~10자, 공백만으로는 불가
          example: 장윤호
        email:
          type: string
          format: email
          description: 인증을 완료한 이메일. `@dsm.hs.kr` 형식만 허용. 이미 가입된 이메일이면 409 EMAIL_ALREADY_EXISTS
          example: example@dsm.hs.kr
        emailVerifiedToken:
          type: string
          description: 이메일 OTP 검증 API에서 받은 토큰. 토큰에 연결된 이메일과 email이 같아야 함
          example: 3f2a9c1e-7b4d-4e8a-9c2f-1d5e6a7b8c9d
    AuthTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: '액세스 토큰. `Authorization: Bearer {accessToken}` 헤더로 전달'
          example: eyJhbGci...
        refreshToken:
          type: string
          description: 리프레시 토큰. 액세스 토큰 재발급에 사용
          example: eyJhbGci...
    StudentClub:
      type: &id010
      - object
      - 'null'
      description: 소속 동아리 정보. 동아리가 없으면 null
      properties: &id011
        id:
          type: integer
          description: 동아리 id
          format: int64
          example: 1
        name:
          type: string
          description: 동아리 이름
          example: DMS
        logo:
          type: string
          description: 동아리 로고
          example: sakjdfk-jfksdajkfjasdkimage.png
    StudentCreateRequest:
      type: object
      properties:
        studentNumber:
          type: integer
          description: 학번. 1000~3999 범위의 4자리로 앞 1자리가 학년, 다음 1자리가 반, 마지막 2자리가 번호.
          format: int32
          minimum: 1000
          maximum: 3999
          example: 2315
        name:
          type: string
          description: 이름
          example: 김준서
        birthDate:
          type: string
          description: 생일
          format: date
          example: '2009-07-28'
        email:
          type: string
          description: 이메일. `@dsm.hs.kr` 형식만 허용.
          example: junseo@dsm.hs.kr
      required:
      - studentNumber
      - name
      - birthDate
      - email
    StudentUpdateRequest:
      type: object
      required:
      - studentNumber
      - name
      - birthDate
      - email
      properties:
        studentNumber:
          type: integer
          description: 학번. 1000~3999 범위의 4자리로 앞 1자리가 학년, 다음 1자리가 반, 마지막 2자리가 번호.
          format: int32
          minimum: 1000
          maximum: 3999
          example: 2315
        name:
          type: string
          description: 이름
          example: 김준서
        birthDate:
          type: string
          description: 생일
          format: date
          example: '2009-07-28'
        email:
          type: string
          description: 이메일. `@dsm.hs.kr` 형식만 허용.
          example: junseo@dsm.hs.kr
    StudentResponse:
      type: object
      properties:
        id:
          type: integer
          description: 학생의 id
          format: int64
          example: 1
        studentNumber:
          type: integer
          description: 학번. 1000~3999 범위의 4자리로 앞 1자리가 학년, 다음 1자리가 반, 마지막 2자리가 번호.
          format: int32
          minimum: 1000
          maximum: 3999
          example: 2315
        grade:
          type: integer
          description: 학년. studentNumber에서 파생
          format: int32
          example: 2
        classNum:
          type: integer
          description: 반. studentNumber에서 파생
          format: int32
          example: 3
        number:
          type: integer
          description: 번호. studentNumber에서 파생
          format: int32
          example: 15
        name:
          type: string
          description: 이름
          example: 김준서
        birthDate:
          type: string
          description: 생일
          format: date
          example: '2009-07-28'
        email:
          type: string
          description: 이메일
          example: junseo@dsm.hs.kr
        club:
