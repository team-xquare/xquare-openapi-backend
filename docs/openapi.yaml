      description: '급식 정보를 수정한다. 등록과 같은 모든 필드를 보내야 하며, 보낸 값으로 통째로 바꾼다. 다른 급식이 있는 날짜로 바꾸면 409.
        수정한 급식은 이후 나이스 동기화가 덮어쓰지 않는다. 세 끼를 모두 빈 배열로 보내면 ''급식 없음''으로 표시되어 조회에서 빠지고, 나이스 동기화도 그 날짜를 다시 만들지 않는다.
        날짜를 옮기면 원래 날짜에 ''급식 없음'' 표시를 남겨 동기화가 같은 급식을 다시 만들지 않게 한다. ''급식 없음''으로 표시된 날짜로는 옮길 수 있다(그 표시는 지워진다). 권한: ADMIN.'
      operationId: updateMeal
      security:
      - bearerAuth: []
      x-required-role: ADMIN
      parameters:
      - name: mealId
        in: path
        required: true
        description: 수정할 급식 정보의 id
        schema:
          type: integer
          format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealUpdateRequest'
            example:
              date: '2026-09-01'
              breakfast:
              - 볶음밥
              - 미역국
              lunch:
              - 백미밥
              - 된장찌개
              dinner:
              - 카레라이스
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: 수정되었습니다.
        '400':
          description: '`INVALID_INPUT`: 등록과 같은 입력 검증 실패, mealId가 숫자가 아님'
          content:
            application/json:
              schema: *id007
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
        '409':
          description: 'MEAL_ALREADY_EXISTS: 바꾸려는 날짜에 다른 급식 정보가 이미 존재함'
          content:
            application/json:
              schema: *id007
              examples:
                MEAL_ALREADY_EXISTS:
                  value:
                    code: MEAL_ALREADY_EXISTS
                    message: 해당 날짜의 급식 정보가 이미 존재함
        '401':
          description: 'INVALID_TOKEN: 토큰이 없거나 유효하지 않음'
          content:
            application/json:
              schema: *id007
              examples:
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 토큰이 없거나 유효하지 않음
        '403':
          description: 'FORBIDDEN: 권한 없음'
          content:
            application/json:
              schema: *id007
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: 권한 없음
        '404':
          description: 'MEAL_NOT_FOUND: 존재하지 않는 급식 정보 id이거나 ''급식 없음''으로 표시된 급식'
          content:
            application/json:
              schema: *id007
              examples:
                MEAL_NOT_FOUND:
                  value:
                    code: MEAL_NOT_FOUND
                    message: 존재하지 않는 급식 정보 id
  /clubs:
    get:
      tags:
      - 동아리
      summary: 동아리 검색
      description: '동아리명(부분 일치)·구성원 이름(복수 가능)·교실·담당 선생님 이름으로 동아리를 검색하고 페이지 단위로 반환한다. 조건은 모두 AND로 묶고, 등록 순(id)으로 정렬한다.
        동아리명·구성원 이름의 `%`, `_`는 글자 그대로 찾는다. 권한: USER 이상.'
      operationId: searchClubs
      security:
      - bearerAuth: []
      x-required-role: USER
      parameters:
      - name: name
        in: query
        required: false
        description: 검색할 동아리명(부분 일치)
        schema:
          type: string
          example: DMS
      - name: member
        in: query
        required: false
        description: 동아리 구성원 이름(부분 일치). 여러 명 동시 검색 가능(member=성준&member=민수)하며, 준 이름이 모두 구성원에 있는 동아리만 찾는다(AND). 최대 10개
        style: form
        explode: true
        schema:
          type: array
          maxItems: 10
          items:
            type: string
          example:
          - 성준
          - 민수
      - name: room
        in: query
        required: false
        description: 동아리가 사용하는 교실
        schema:
          $ref: '#/components/schemas/ClubRoom'
      - name: teacher
        in: query
        required: false
        description: 담당 선생님 이름(정확히 일치). 교직원 검색의 이름과 같은 방식
        schema:
          type: string
          example: 이진경
      - &id008
        name: page
        in: query
        required: false
        description: 페이지 번호. 0부터 시작, 생략 시 0
        schema:
          type: integer
          format: int32
          default: 0
          example: 0
      - &id009
        name: size
        in: query
        required: false
        description: 페이지당 개수. 생략 시 20, 최대 100
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          example: 20
      responses:
        '200':
          description: 동아리 목록(content)과 페이지 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubListResponse'
        '400':
          description: '`INVALID_INPUT`: page 0~21474836·size 1~100 밖, member 10개 초과, 없는 room 값, 숫자가 아닌 page·size'
          content:
            application/json:
              schema: *id007
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: '요청 값이 올바르지 않습니다.'
        '401':
          description: 'INVALID_TOKEN: 토큰이 없거나 유효하지 않음'
          content:
            application/json:
              schema: *id007
              examples:
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 토큰이 없거나 유효하지 않음
    post:
      tags:
      - 동아리
      summary: 동아리 등록
      description: '동아리를 등록한다. 팀장(manager)은 member에 포함돼야 하고, 이미 다른 동아리가 쓰는 교실은 지정할 수 없다. 학생의 소속 동아리·교직원의 담당 동아리는 이 API의 member·teacher로만
        바뀐다. teacher는 생략 가능. 한 학생은 한 동아리에만 속하고 한 교직원은 한 동아리만 담당하므로, 이미 다른 동아리에 속한 학생·담당 교직원을 넣으면 409. member에 같은 id가 여러 번 있으면 한 번으로 친다.
        권한: ADMIN.'
      operationId: createClub
      security:
      - bearerAuth: []
      x-required-role: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubCreateRequest'
            example:
              name: DMS
              logo: b0c39b24-792f-48cf-9492-ed238ed48486파일1.png
              room: ROOM_2_1
              manager: 1
              member:
              - 1
              - 2
              - 3
              - 4
              - 5
              teacher: 3
      responses:
        '201':
          description: 생성됨
          headers:
            Location:
              description: 생성된 리소스를 상세조회하는 URI
              schema:
                type: string
                format: uri-reference
                example: /clubs/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: 생성되었습니다.
        '400':
          description: 'ROOM_ALREADY_IN_USE: 다른 동아리가 이미 사용 중인 교실; MANAGER_NOT_IN_MEMBER: manager가 member에 포함되지 않음; INVALID_INPUT: 필수 값 누락, name 공백·20자 초과, logo 공백·255자 초과, member 50개 초과, 없는 room 값'
          content:
            application/json:
              schema: *id007
              examples:
                ROOM_ALREADY_IN_USE:
                  value:
                    code: ROOM_ALREADY_IN_USE
                    message: 다른 동아리가 이미 사용 중인 교실
                MANAGER_NOT_IN_MEMBER:
                  value:
                    code: MANAGER_NOT_IN_MEMBER
                    message: manager가 member에 포함되지 않음
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: '요청 값이 올바르지 않습니다.'
        '401':
          description: 'INVALID_TOKEN: 토큰이 없거나 유효하지 않음'
          content:
            application/json:
              schema: *id007
              examples:
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 토큰이 없거나 유효하지 않음
        '403':
          description: 'FORBIDDEN: 권한 없음'
          content:
            application/json:
              schema: *id007
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: 권한 없음
        '404':
          description: 'STUDENT_NOT_FOUND: 존재하지 않는 학생 id; TEACHER_NOT_FOUND: 존재하지 않는 교직원 id'
          content:
            application/json:
              schema: *id007
              examples:
                STUDENT_NOT_FOUND:
                  value:
                    code: STUDENT_NOT_FOUND
                    message: 존재하지 않는 학생 id
                TEACHER_NOT_FOUND:
                  value:
                    code: TEACHER_NOT_FOUND
                    message: 존재하지 않는 교직원 id
        '409':
          description: '`STUDENT_ALREADY_IN_CLUB`: member에 다른 동아리 소속 학생이 있음 / `TEACHER_ALREADY_IN_CLUB`: 다른 동아리를 담당하는 교직원'
          content:
            application/json:
              schema: *id007
              examples:
                STUDENT_ALREADY_IN_CLUB:
                  value:
                    code: STUDENT_ALREADY_IN_CLUB
                    message: 이미 다른 동아리에 속한 학생입니다.
                TEACHER_ALREADY_IN_CLUB:
                  value:
                    code: TEACHER_ALREADY_IN_CLUB
                    message: 이미 다른 동아리를 담당하는 교직원입니다.
