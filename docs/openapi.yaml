      description: '공지를 등록한다. 작성자(author)는 토큰의 사용자로 서버에서 자동 설정되고, 작성일시(createdAt)는 서버의 서울 시간(초 단위)이다. body의 다른 필드(author, createdAt 등)는 무시한다. 기능 명세서 기준 제목은 필수·최대 100자, 본문은 필수·최대 4000자(공백만 있으면 안 됨, 위반 시 400 INVALID_INPUT). 토큰은 유효하지만 그 사용자가 지워졌으면 401 INVALID_TOKEN. 권한: ADMIN.'
      operationId: createNotice
      security:
      - bearerAuth: []
      x-required-role: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeCreateRequest'
            example:
              title: 2학기 동아리 모집 안내
              content: 9월 15일까지 각 동아리 부장에게 신청서를 제출하세요.
      responses:
        '201':
          description: 생성됨
          headers:
            Location:
              description: 생성된 리소스를 상세조회하는 URI
              schema:
                type: string
                format: uri-reference
                example: /notices/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: 생성되었습니다.
        '400':
          description: '`INVALID_INPUT`: title·content 누락·null·공백, title 100자 초과, content 4000자 초과, JSON 형식 오류'
          content:
            application/json:
              schema: *id007
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: '요청 값이 올바르지 않습니다.'
        '401':
          description: 'INVALID_TOKEN: 토큰이 없거나 유효하지 않음'
          content:
            application/json:
              schema: *id007
              examples:
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 토큰이 없거나 유효하지 않음
        '403':
          description: 'FORBIDDEN: 권한 없음'
          content:
            application/json:
              schema: *id007
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: 권한 없음
  /notices/{noticeId}:
