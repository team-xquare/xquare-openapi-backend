                $ref: '#/components/schemas/ErrorResponse'
              examples:
                API_KEY_FIELD_FORBIDDEN:
                  value:
                    code: API_KEY_FIELD_FORBIDDEN
                    message: API 키로 신청하지 않은 분야입니다. 해당 분야를 활용신청해 주세요.
    post:
      tags:
