      responses:
        '200':
          description: 재발급됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '400':
          description: '`INVALID_INPUT`: 이메일 인증 토큰 누락·공백'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
        '401':
          description: '`INVALID_TOKEN`: 토큰이 없거나 유효하지 않음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 토큰이 없거나 유효하지 않습니다.
        '403':
          description: '`EMAIL_NOT_VERIFIED`: 이메일 인증 토큰이 없거나 만료됨, 또는 로그인한 사용자의 이메일로 받은 토큰이 아님'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_NOT_VERIFIED:
                  value:
                    code: EMAIL_NOT_VERIFIED
                    message: 이메일 인증이 완료되지 않았습니다.
        '404':
          description: '`API_KEY_NOT_FOUND`: 발급받은 키가 없음. 활용신청을 먼저 해야 함'
          content:
            application/json:
              schema:
