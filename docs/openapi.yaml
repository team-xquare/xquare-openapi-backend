openapi: 3.1.0
info:
  title: XQUARE Open API
  version: 0.1.0
  description: |-
    노션 "xquare open API"의 API 명세서와 기능 명세서를 합쳐 만든 명세입니다. 두 명세서가 다르면 API 명세서를 따랐습니다.

    권한: `security: []`인 API는 인증 없이 호출할 수 있습니다. `apiKeyAuth`인 조회 API는 `X-API-Key: <apiKey>`가 필요하고 액세스 토큰으로는 호출할 수 없습니다(`x-required-role: API_KEY`). 키는 활용신청한 분야(`ApiKeyField`)의 조회 API만 열 수 있고, 신청하지 않은 분야면 `403 API_KEY_FIELD_FORBIDDEN`입니다. 나머지는 `Authorization: Bearer <accessToken>`이 필요하며, 필요한 권한은 `x-required-role`(USER, ADMIN)에 적었습니다.
tags:
- name: 인증/인가
- name: API 키
- name: 사용자
- name: 학생
- name: 교직원
- name: 자습 감독
- name: 일정
- name: 시간표
- name: 급식
- name: 동아리
- name: 공지
paths:
  /auth/email/otp:
    post:
      tags:
      - 인증/인가
      summary: 이메일 OTP 발송
      description: |-
        DSM 이메일(@dsm.hs.kr)로 회원가입용 6자리 인증코드(100000~999999)를 발송한다. 코드는 Redis에 이메일을 key로 300초 TTL로 저장되며 `email/otp` 템플릿으로 발송된다. 권한: ALL(비로그인 허용).

        발송 제한(기본값, 환경변수로 변경 가능): 같은 이메일은 60초에 1번, 1시간에 5번까지 보낼 수 있고, 같은 IP는 1시간에 30번까지 보낼 수 있다(IP는 연결한 주소이며, 내부망 프록시를 거친 요청만 `X-Forwarded-For`의 클라이언트 IP를 쓴다. IPv6는 /64 접두사가 같으면 같은 IP로 센다). 같은 이메일로 1시간 안에 인증코드를 5번 틀리면 그 창이 끝날 때까지 발송을 막는다. 시간 창은 첫 발송(첫 오입력)부터 1시간인 고정 창이다. 제한에 걸리면 429와 함께 `Retry-After` 헤더(초)로 다시 요청할 수 있을 때까지 남은 시간을 알린다. 발송에 실패해도(500) 쿨다운과 발송 횟수는 되돌리지 않는다.
      operationId: sendEmailOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailOtpSendRequest'
      responses:
        '200':
          description: 인증코드 발송 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: 'INVALID_EMAIL_FORMAT: 빈 이메일, @dsm.hs.kr 형식이 아님 또는 로컬 파트에 영문·숫자·`.`·`_`·`-` 외의 문자(`+`, 따옴표 등) 포함 / INVALID_INPUT: 필드 누락·null 또는 JSON 파싱 실패'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
                INVALID_EMAIL_FORMAT:
                  value:
                    code: INVALID_EMAIL_FORMAT
                    message: '@dsm.hs.kr 형식이 아닙니다.'
        '500':
          description: 'EMAIL_SEND_FAILED: 메일 발송 또는 인증코드 저장 실패. 응답 읽기 타임아웃처럼 메일이 나갔는지 알 수 없는 경우에는 코드를 지우지 않아, 메일을 받았다면 그 코드로 검증할 수 있음(현재 구현 기준)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_SEND_FAILED:
                  value:
                    code: EMAIL_SEND_FAILED
                    message: 메일 발송 또는 인증코드 저장에 실패했습니다.
        '429':
          description: |-
            OTP_RESEND_TOO_SOON: 같은 이메일로 60초 안에 다시 요청함
            OTP_SEND_LIMIT_EXCEEDED: 이메일 또는 IP의 1시간 발송 상한 초과
            OTP_ATTEMPTS_EXCEEDED: 같은 이메일로 1시간 안에 인증코드를 5번 틀림
          headers:
            Retry-After:
              description: 다시 요청할 수 있을 때까지 남은 시간(초, 올림)
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                OTP_RESEND_TOO_SOON:
                  value:
                    code: OTP_RESEND_TOO_SOON
                    message: 인증코드를 너무 자주 요청했습니다. 잠시 후 다시 시도해 주세요.
                OTP_SEND_LIMIT_EXCEEDED:
                  value:
                    code: OTP_SEND_LIMIT_EXCEEDED
                    message: 인증코드 발송 횟수를 초과했습니다. 잠시 후 다시 시도해 주세요.
                OTP_ATTEMPTS_EXCEEDED:
                  value:
                    code: OTP_ATTEMPTS_EXCEEDED
                    message: 인증코드 입력 횟수를 초과했습니다. 잠시 후 다시 시도해 주세요.
  /auth/email/otp/verify:
    post:
      tags:
      - 인증/인가
      summary: 이메일 OTP 검증
      description: '이메일로 받은 6자리 인증코드를 검증하고 회원가입용 emailVerifiedToken을 발급한다. 오입력 횟수는 코드가 아니라 이메일 기준으로 첫 오입력부터 1시간 동안 세며 재발송해도 초기화되지 않는다. 5번째 오입력에서 코드가 폐기되고(OTP_MISMATCH, 이후 OTP_NOT_FOUND), 그 1시간이 끝날 때까지 발송 API가 429 OTP_ATTEMPTS_EXCEEDED를 돌려준다. 검증에 성공하면 오입력 횟수를 지운다. 검증 성공 시 기존 OTP는 삭제되며, 토큰은 600초 TTL로 저장되어 회원가입 요청에
        사용된다. 권한: ALL(비로그인 허용).'
      operationId: verifyEmailOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailOtpVerifyRequest'
      responses:
        '200':
          description: 인증 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEmailVerifiedTokenResponse'
        '400':
          description: |-
            OTP_NOT_FOUND: 발송된 인증코드가 없거나 만료됨 (재발송 필요)
            OTP_MISMATCH: 인증코드 불일치
            INVALID_EMAIL_FORMAT: 빈 이메일, @dsm.hs.kr 형식이 아님 또는 로컬 파트에 영문·숫자·`.`·`_`·`-` 외의 문자(`+`, 따옴표 등) 포함
            INVALID_INPUT: 빈 OTP, 필드 누락·null 또는 JSON 파싱 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
                INVALID_EMAIL_FORMAT:
                  value:
                    code: INVALID_EMAIL_FORMAT
                    message: '@dsm.hs.kr 형식이 아닙니다.'
                OTP_NOT_FOUND:
                  value:
                    code: OTP_NOT_FOUND
                    message: 발송된 인증코드가 없거나 만료되었습니다. 재발송이 필요합니다.
                OTP_MISMATCH:
                  value:
                    code: OTP_MISMATCH
                    message: 인증코드가 일치하지 않습니다.
        '500':
          description: 'INTERNAL_SERVER_ERROR: Redis 장애로 검증하지 못함. 인증 토큰을 먼저 저장하므로 토큰 저장 실패 시 코드는 남아 같은 코드로 다시 검증할 수 있음(현재 구현 기준)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_SERVER_ERROR:
                  value:
                    code: INTERNAL_SERVER_ERROR
                    message: 일시적인 서버 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.
  /auth/login:
    post:
      tags:
      - 인증/인가
      summary: 로그인
      description: 'username으로 사용자를 조회하고 BCrypt로 비밀번호를 검증한 뒤 accessToken과 refreshToken을 발급한다. 아이디 존재 여부 노출을 막기 위해 아이디/비밀번호
        오류는 구분하지 않고 INVALID_CREDENTIALS 하나로 응답한다(기능 명세서). 아이디가 없을 때도 비밀번호 비교를 거쳐 응답 시간으로도 아이디 존재 여부가 드러나지 않게 한다.
        username·password가 비어 있으면 400 INVALID_INPUT이고, 형식(길이·문자 종류)은 검사하지 않아 형식이 틀린 값은 INVALID_CREDENTIALS가 된다(현재 구현 기준).
        다시 로그인하면 이전에 발급한 refreshToken은 폐기된다(사용자당 세션 하나). 로그인 5회 실패 시 계정이 잠긴다(ACCOUNT_LOCKED, 잠금 해제 조건은 미정이라 아직 구현하지
        않음). 권한: ALL(비로그인 허용).'
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 'INVALID_INPUT: username 또는 password가 비어 있음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
        '401':
          description: 'INVALID_CREDENTIALS: 아이디 또는 비밀번호 불일치'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_CREDENTIALS:
                  value:
                    code: INVALID_CREDENTIALS
                    message: 아이디 또는 비밀번호가 올바르지 않습니다.
        '423':
          description: 'ACCOUNT_LOCKED: 로그인 5회 실패로 계정 잠금'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ACCOUNT_LOCKED:
                  value:
                    code: ACCOUNT_LOCKED
                    message: 로그인 5회 실패로 계정이 잠겼습니다.
  /auth/reissue:
    post:
      tags:
      - 인증/인가
      summary: 토큰 재발급
      description: '로그인 시 발급받은 refreshToken으로 새 accessToken과 refreshToken을 발급한다. 사용된 refreshToken은 폐기된다. 사용자당 가장 최근에 발급한 refreshToken
        하나만 유효해서, 이미 재발급에 썼거나 그 뒤 다시 로그인한 refreshToken은 INVALID_REFRESH_TOKEN이다. 발급 뒤 비밀번호가 바뀐 refreshToken(비밀번호 재설정과
        동시에 진행된 로그인이 받은 것 포함)과 비밀번호 지문이 없는 예전 형식의 refreshToken도 INVALID_REFRESH_TOKEN이다. refreshToken이 비어 있으면 400 INVALID_INPUT(현재 구현 기준).
        권한: ALL(비로그인 허용).'
      operationId: reissueToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthReissueRequest'
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 'INVALID_INPUT: refreshToken이 비어 있음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
        '401':
          description: 'INVALID_REFRESH_TOKEN: 리프레시 토큰이 없거나 만료·폐기됨, 또는 발급 뒤 비밀번호가 바뀜 (재로그인 필요)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_REFRESH_TOKEN:
                  value:
                    code: INVALID_REFRESH_TOKEN
                    message: 리프레시 토큰이 없거나 만료 또는 폐기되었습니다. 재로그인이 필요합니다.
  /auth/password/reset:
    post:
      tags:
      - 인증/인가
      summary: 비밀번호 재설정
      description: '이메일 OTP 발송(`/auth/email/otp`)·검증(`/auth/email/otp/verify`)으로 받은 emailVerifiedToken과 새 비밀번호로 비밀번호를 바꾼다. 이메일은 요청으로 받지
        않고 토큰에 저장된 값을 쓰며, 그 이메일로 가입한 사용자의 비밀번호를 BCrypt로 인코딩해 저장한다. 새 비밀번호 규칙은 회원가입과 같다. 토큰은 비밀번호를 바꾸기 전에
        원자적으로 소비하므로(1회용) 같은 토큰으로 동시에 요청해도 하나만 성공하고 나머지는 403이다. 성공하면 그 사용자의 refreshToken을 폐기하고, 재설정과 동시에 옛 비밀번호로 로그인해 받은 refreshToken도 재발급에서 거절되어 기존 세션은 재발급할 수 없다. 이미 발급된 accessToken은 만료(1시간) 전까지 유효하다. 토큰은 회원가입과 같은 것을 쓴다(현재 구현 기준).
        권한: ALL(비로그인 허용).'
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasswordResetRequest'
      responses:
        '200':
          description: 재설정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: 비밀번호가 변경되었습니다.
        '400':
          description: 'INVALID_INPUT: emailVerifiedToken이 비어 있거나 newPassword가 규칙에 맞지 않음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 'newPassword: 8~20자 영문/숫자/특수문자이며 특수문자를 포함해야 합니다.'
        '403':
          description: 'EMAIL_NOT_VERIFIED: emailVerifiedToken이 없거나 만료됐거나 이미 사용됨(동시 요청 중 먼저 소비한 요청이 있는 경우 포함)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_NOT_VERIFIED:
                  value:
                    code: EMAIL_NOT_VERIFIED
                    message: 이메일 인증이 완료되지 않았습니다.
        '404':
          description: 'USER_NOT_FOUND: 토큰의 이메일로 가입한 사용자가 없음 (토큰은 지우지 않음)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USER_NOT_FOUND:
                  value:
                    code: USER_NOT_FOUND
                    message: 가입되지 않은 이메일입니다.
        '500':
          description: 'INTERNAL_SERVER_ERROR: Redis·DB 장애. 비밀번호는 바뀌지 않음. 토큰을 이미 소비한 뒤의 장애라면 토큰은 되살리지 않으므로 OTP 인증부터 다시 받아야 함'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_SERVER_ERROR:
                  value:
                    code: INTERNAL_SERVER_ERROR
                    message: 일시적인 서버 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.
  /auth/signup:
    post:
      tags:
      - 인증/인가
      summary: 회원가입
      description: '이메일 OTP 검증으로 받은 emailVerifiedToken을 사용해 계정을 생성한다. 토큰에 연결된 이메일과 요청 email이 같아야 한다. 비밀번호는 BCrypt로 인코딩해 저장하며,
        기본 권한은 USER이다. 가입 즉시 로그인 처리되어 토큰을 반환한다. 입력 검증 실패 시 400 INVALID_INPUT을 반환한다(현재 구현 기준). 권한: ALL(비로그인 허용).'
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSignupRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 'INVALID_INPUT: 요청 값 검증 실패'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
        '403':
          description: 'EMAIL_NOT_VERIFIED: emailVerifiedToken이 없거나 만료됨, 또는 토큰의 이메일과 요청 이메일 불일치'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_NOT_VERIFIED:
                  value:
                    code: EMAIL_NOT_VERIFIED
                    message: 이메일 인증이 완료되지 않았습니다.
        '409':
          description: 'USERNAME_ALREADY_EXISTS: 이미 사용 중인 아이디 / EMAIL_ALREADY_EXISTS: 이미 가입된 이메일'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USERNAME_ALREADY_EXISTS:
                  value:
                    code: USERNAME_ALREADY_EXISTS
                    message: 이미 사용 중인 아이디입니다.
                EMAIL_ALREADY_EXISTS:
                  value:
                    code: EMAIL_ALREADY_EXISTS
                    message: 이미 사용 중인 이메일입니다.
  /api-keys:
    post:
      tags:
      - API 키
      summary: 활용신청 등록 (분야별)
      description: '분야 하나를 활용신청한다. 자동 승인이다. 키가 없으면 첫 신청(`FIRST`)으로 API 키를 발급하고 원문을 응답에 담는다. 이미 키가 있으면 분야 추가(`ADD_FIELD`)로
        같은 키에 분야만 더하고 키는 다시 주지 않는다(`apiKey: null`). 사용자당 키는 1개. 신청 전에 `POST /auth/email/otp`·`POST /auth/email/otp/verify`로
        로그인한 계정의 이메일을 인증하고 받은 `emailVerifiedToken`을 보내야 하며, 신청에 성공하면 토큰은 폐기된다. 권한: USER, ADMIN(로그인한 본인).'
      operationId: applyApiKey
      security:
      - bearerAuth: []
      x-required-role: USER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyApplicationRequest'
            example:
              field: STUDENT
              serviceName: 급식 알리미
              purpose: 반 단톡방에 매일 급식을 올리려고 합니다.
              emailVerifiedToken: 3f1c2a9e-8b7d-4e6f-9a01-2b3c4d5e6f70
      responses:
        '201':
          description: 신청됨. 첫 신청이면 키 원문을 주고, 분야 추가면 `apiKey`가 null이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyApplicationResponse'
              examples:
                FIRST:
                  value:
                    type: FIRST
                    apiKey: xq_UNhY4JhezH9gQYqvDMWrWH9CwlcKiECVqejMrND2VFw
                ADD_FIELD:
                  value:
                    type: ADD_FIELD
                    apiKey: null
        '400':
          description: '`INVALID_INPUT`: 필수 값 누락, 없는 분야, 서비스 이름 공백·30자 초과, 사용 목적 공백·200자 초과, 이메일 인증 토큰 공백'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: 요청 값이 올바르지 않습니다.
        '401':
          description: '`INVALID_TOKEN`: 토큰이 없거나 유효하지 않음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 토큰이 없거나 유효하지 않습니다.
        '403':
          description: '`EMAIL_NOT_VERIFIED`: 이메일 인증 토큰이 없거나 만료됨, 또는 로그인한 사용자의 이메일로 받은 토큰이 아님'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_NOT_VERIFIED:
                  value:
                    code: EMAIL_NOT_VERIFIED
                    message: 이메일 인증이 완료되지 않았습니다.
        '409':
          description: '`API_KEY_FIELD_ALREADY_APPLIED`: 이미 신청한 분야. `API_KEY_ALREADY_EXISTS`: 같은 사용자의 첫 신청이 동시에 처리되어 키가 먼저 발급됨. 다시
            신청하면 분야 추가로 처리된다'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                API_KEY_FIELD_ALREADY_APPLIED:
                  value:
                    code: API_KEY_FIELD_ALREADY_APPLIED
                    message: 이미 신청한 분야입니다.
                API_KEY_ALREADY_EXISTS:
                  value:
                    code: API_KEY_ALREADY_EXISTS
                    message: 동시에 처리된 활용신청으로 API 키가 이미 발급되었습니다. 다시 신청하면 분야가 추가됩니다.
  /api-keys/reissue:
    post:
      tags:
      - API 키
      summary: API 키 재발급
      description: '키 값만 새로 발급하고 기존 키는 즉시 폐기한다(이전 키로 조회하면 바로 `401 INVALID_API_KEY`). 신청한 분야와 신청 기록은 그대로 둔다. 키 원문은 이 응답에서만
        볼 수 있다. 활용신청과 같이 로그인한 계정의 이메일로 받은 `emailVerifiedToken`이 필요하고, 성공하면 토큰은 폐기된다. 권한: USER, ADMIN(로그인한 본인).'
      operationId: reissueApiKey
