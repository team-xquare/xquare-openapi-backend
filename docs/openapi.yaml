          format: int32
          example: 20
        totalCount:
          type: integer
          description: 조건에 해당하는 전체 학생 수
          format: int32
          example: 312
        totalPage:
          type: integer
          description: 전체 페이지 수
          format: int32
          example: 16
    TeacherClub:
