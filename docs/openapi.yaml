        '400':
          description: '`INVALID_INPUT`: title·content 누락·null·공백, title 100자 초과, content 4000자 초과, JSON 형식 오류, 숫자가 아닌 noticeId'
          content:
            application/json:
              schema: *id007
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: '요청 값이 올바르지 않습니다.'
        '401':
          description: 'INVALID_TOKEN: 토큰이 없거나 유효하지 않음'
          content:
            application/json:
              schema: *id007
              examples:
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 토큰이 없거나 유효하지 않음
        '403':
          description: 'FORBIDDEN: 권한 없음'
          content:
            application/json:
              schema: *id007
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: 권한 없음
        '404':
          description: 'NOTICE_NOT_FOUND: 존재하지 않는 공지 id'
          content:
            application/json:
              schema: *id007
              examples:
                NOTICE_NOT_FOUND:
                  value:
