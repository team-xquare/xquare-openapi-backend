      summary: 공지 수정
      description: '공지의 제목과 본문을 통째로 바꾼다(두 필드 모두 필수). 작성자가 아니어도 ADMIN이면 수정할 수 있고, 작성자(author)와 작성일시는 그대로 두고 수정일시(updatedAt)를 서버의 서울 시간으로 남긴다. 같은 값으로 수정해도 200이고 updatedAt이 바뀐다. 기능 명세서 기준 제목은 필수·최대 100자, 본문은 필수·최대 4000자(위반 시 400 INVALID_INPUT). 권한: ADMIN.'
